name: build
on:
  push:
    branches: [main]
    paths: [Dockerfile, Caddyfile, "*.ini", ".github/workflows/build.yml"]
  pull_request:
    paths: [Dockerfile, Caddyfile, "*.ini", ".github/workflows/build.yml"]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-latest }
          - { arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve names and version
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "GROCY_VERSION=$(grep -oP '^ARG GROCY_VERSION=v\K\S+' Dockerfile)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build locally (for tests and scan)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: local/grocy:ci
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      - name: Extension check
        run: |
          docker run --rm --read-only --entrypoint php local/grocy:ci -r '
            foreach (["gd","intl","pdo_sqlite","mbstring","fileinfo","ctype"] as $e)
              if (!extension_loaded($e)) { fwrite(STDERR, "missing $e\n"); exit(1); }'

      - name: Boot test (production-like hardening)
        run: |
          printf '<?php\n' > "$RUNNER_TEMP/config.php"
          docker run -d --name grocy-ci -p 8080:8080 \
            --read-only --tmpfs /tmp \
            --tmpfs /app/data:uid=65532,gid=65532 \
            -v "$RUNNER_TEMP/config.php:/app/data/config.php:ro" \
            --cap-drop ALL --security-opt no-new-privileges \
            local/grocy:ci
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o "$RUNNER_TEMP/out" -w '%{http_code}' http://localhost:8080/ || true)
            case "$code" in 200|302) break ;; esac
            sleep 1
          done
          docker logs grocy-ci
          if grep -q "Unable to run Grocy" "$RUNNER_TEMP/out" 2>/dev/null; then
            cat "$RUNNER_TEMP/out"; exit 1
          fi
          case "$code" in 200|302) ;; *) echo "unexpected HTTP status: $code"; exit 1 ;; esac
          docker rm -f grocy-ci

      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/grocy:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ env.REPO_OWNER }}/grocy,push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve names and version
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "GROCY_VERSION=$(grep -oP '^ARG GROCY_VERSION=v\K\S+' Dockerfile)" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ env.REPO_OWNER }}/grocy
          tags: |
            type=raw,value=${{ env.GROCY_VERSION }}
            type=sha,prefix=sha-

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "ghcr.io/${REPO_OWNER}/grocy@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "ghcr.io/${REPO_OWNER}/grocy:${GROCY_VERSION}"
